[package]
name = "red_engine2"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kevstermcgee/RedEngine"
description = "AI-first Rust game engine: JSON scenes, self-verifying maps, authoritative multiplayer, headless tooling"

# The 2D game crate (`red2d`): a declarative 2D game, its headless simulation and CPU renderer. A workspace member so one lock file covers it;
# `default-members` keeps plain `cargo build/test/clippy` covering it too. `games/killchain` is a member too (one lock, one target directory) but NOT a default member: it is a game on the
# engine's public API with graphics dependencies of its own, so the engine's plain builds and the headless server build never compile it (`scripts/ci.sh killchain` does).
[workspace]
members = ["crates/red2d", "games/killchain"]
default-members = [".", "crates/red2d"]

# `gfx` (default) = everything that draws or plays sound: wgpu, winit, softbuffer, rodio (MP4 export is the separate `video` feature). The dedicated server, the bot and the
# map-analysis CLI build without it (`cargo build --no-default-features --bin red_server`); CI enforces that on Linux.
#
# `render` = the wgpu renderer on its own (no window, no sound device, no ffmpeg); `gfx` = `render` plus the desktop around it (a window, audio, a pad, dialogs).
[features]
default = ["gfx", "mcp"]
# `mcp` = `red_engine2 mcp`, the authoring adapter (rmcp, schemars, base64). The dedicated server and the bot never need it: `--no-default-features` leaves it out.
# `video` = MP4 export (`red_engine2 render`, `render_video`): the scene is piped to an ffmpeg process by ffmpeg-sidecar. Not in `default`: PNG frames, tours, storyboards and
# every verification path need no ffmpeg. Build it with `cargo build --features video`.
video = ["render", "dep:ffmpeg-sidecar"]
mcp = ["dep:rmcp", "dep:schemars", "dep:base64"]
render = ["dep:wgpu", "dep:pollster"]
gfx = ["render", "dep:softbuffer", "dep:winit", "dep:rodio", "dep:gilrs", "dep:rfd"]

[dependencies]
red2d = { path = "crates/red2d" }
gilrs = { version = "0.11.2", optional = true }
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
# `flate2` + `crc32fast`: already in the tree for PNG; `red_engine2 package` uses them to write a deterministic zip.
crc32fast = "1.5"
env_logger = "0.11.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ffmpeg-sidecar = { version = "2.5.2", optional = true }
# `libm`: glam uses the pure-Rust libm for sin/cos/atan2 instead of the platform C library, so simulation maths is
# bit-identical on Windows and Linux (replay checksums, ADR 0019).
glam = { version = "0.33.8", features = ["serde", "libm"] }
libm = "0.2"
# Graceful Ctrl-C and SIGTERM (`docker stop`) for `red_server` (tell clients bye, write the `--record` trace).
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = { version = "1.0.1", optional = true }
rodio = { version = "0.20", default-features = false, optional = true }
rapier3d = { version = "0.35", features = ["enhanced-determinism"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.20"
# The production network transport (ADR 0044): QUIC datagrams + TLS 1.3 from maintained implementations, and the primitives the
# remaining application-level proofs use. All graphics-free: they are part of the headless server build.
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
getrandom = "0.3"
bytes = "1"
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30", optional = true }
# The native 2D player (`re2d`, `red_engine2 play2d`) shows the CPU-rendered frame through the OS window with no GPU involved.
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"], optional = true }
rfd = { version = "0.17.2", optional = true }

# The network stack and the Ctrl-C hook: native only (`mio` does not exist in a browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "crypto"] }
# The MCP server (`red_engine2 mcp`, ADR 2026-10-06-a-native-mcp-server): the official Rust SDK over stdio, tool arguments as typed structs whose JSON Schemas `schemars` generates.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# `--profile fast` (`RED_PROFILE=fast scripts/dev build`): an optimized build to iterate on a game or the client without waiting for the release
# profile's full LTO (4+ minutes; this one takes a fraction of that after the first build). Same speed to play; use `--release` to ship.
# codegen-units is 4 on purpose for the dependencies: rustc crashed compiling the `wide` crate (a physics dependency) at 16 on one machine (STATUS_STACK_BUFFER_OVERRUN).
# The engine crate alone gets 256 and incremental compilation (which only ever applies to it, never to registry dependencies): incremental reuses
# whole codegen units, so with 4 an edit recompiled a quarter of the crate. Measured on the 4-core dev/server box (benches/history/build-times.json):
# the edit loop went 57 s -> 4-5 s with no change in server tick times. Optimization level is unchanged.
# Artifacts land in `target/fast/` (or `$CARGO_TARGET_DIR/fast/`).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 4
incremental = true

[profile.fast.package.red_engine2]
codegen-units = 256

# Plain `cargo test` runs rapier and 900-tick physics tests: unoptimized they are ~20x slower and the
# per-step timing assertions get flaky. Light optimization everywhere, more for dependencies.
#
# Debug info is the biggest build cost after codegen: with full debuginfo every one of the ~27 test binaries writes a PDB/DWARF for the whole
# dependency tree (about twice the disk, slower links; on a nearly full disk the MSVC linker fails with LNK1140). `line-tables-only` keeps
# file:line in panics and backtraces, which is all the tests and tools need; dependencies get none. Set `debug = true` locally to step in a debugger.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[dev-dependencies]
criterion = "0.8.2"
# The same shader compiler wgpu uses, here to validate every WGSL module and translate it to Direct3D's HLSL on any machine (tests/shader_validation.rs).
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }

# Benches only need to be *comparable run to run*, not maximally fast: thin LTO keeps `cargo bench`
# builds to about a minute instead of the several a full-LTO release build takes.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

[[bin]]
name = "re2"
path = "src/bin/re2/main.rs"
required-features = ["gfx"]

[[bin]]
name = "re2d"
path = "src/bin/re2d/main.rs"
required-features = ["gfx"]

[[bench]]
name = "sim"
harness = false

[[bench]]
name = "settled_world"
harness = false

[[bench]]
name = "render_prep"
harness = false
required-features = ["gfx"]

# CI runs `cargo clippy --all-targets -- -D warnings`. These are style-only lints the existing code
# predates (index loops over parallel arrays, wide renderer entry points); allowed on purpose so CI can be
# strict about everything else. Prefer fixing over adding to this list.
[lints.clippy]
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"

