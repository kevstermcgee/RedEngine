[package]
name = "red_engine2"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
ffmpeg-sidecar = "2.5.2"
glam = { version = "0.33.8", features = ["serde"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = "1.0.1"
rodio = { version = "0.20", default-features = false }
rapier3d = { version = "0.35", features = ["enhanced-determinism"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
wgpu = "30.0.1"
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Plain `cargo test` runs rapier and 900-tick physics tests: unoptimized they are ~20x slower and the
# per-step timing assertions get flaky. Light optimization everywhere, more for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
criterion = "0.8.2"

# Benches only need to be *comparable run to run*, not maximally fast: thin LTO keeps `cargo bench`
# builds to about a minute instead of the several a full-LTO release build takes.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

[[bench]]
name = "sim"
harness = false

# CI runs `cargo clippy --all-targets -- -D warnings`. These are style-only lints the existing code
# predates (index loops over parallel arrays, wide renderer entry points); allowed on purpose so CI can be
# strict about everything else. Prefer fixing over adding to this list.
[lints.clippy]
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
