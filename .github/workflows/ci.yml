name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: full build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (audio backend for rodio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked --no-fail-fast
      - name: benches compile
        run: cargo bench --locked --no-run
      # Wall-clock bench regressions are NOT gated here: shared runners are too noisy. Run
      # `cargo bench --bench sim && python benches/check.py` locally (benches/README.md). The
      # deterministic performance guards (tests/alloc_budget.rs, body/entity counts) run in `cargo test`.

  # The dedicated server on a bare Linux box: no window, GPU, audio or ffmpeg libraries installed, and none may
  # be compiled or linked either. This is the job that keeps `red_server` deployable on a small VPS.
  headless-linux:
    name: headless server (linux, no gfx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: the dependency tree has no graphics/audio crates
        run: |
          if cargo tree --locked --no-default-features -e normal --prefix none | grep -E '^(wgpu|winit|rodio|cpal|alsa|pollster|ffmpeg-sidecar|naga|ash) '; then
            echo "a graphics/audio crate leaked into the headless build"; exit 1
          fi
      - name: build the server and the bot
        run: cargo build --locked --release --no-default-features --bin red_server --bin red_bot
      - name: clippy (headless)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: tests (headless, incl. real-UDP server tests)
        run: cargo test --locked --no-default-features --no-fail-fast

  # The container image people deploy: builds headless, starts, listens on UDP 27015 and exits cleanly.
  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t red-server .
      - name: starts, listens, stops cleanly
        run: |
          docker run --rm red-server --run-for 3 --stats-secs 0 | tee out.txt
          grep -q '^LISTENING 0.0.0.0:27015' out.txt
          grep -q '^stopped:' out.txt
