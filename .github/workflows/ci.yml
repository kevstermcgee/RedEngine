name: CI
# Full CI belongs at integration boundaries: pull requests and pushes to main. Work-in-progress branch pushes are not built twice (once for the
# push, once for the pull request), a newer push to the same pull request cancels the older run, and jobs that cannot be affected by a change
# are skipped (a docs-only change does not build a Docker image or a Windows binary). The steps themselves are `scripts/ci.sh <stage>`, so
# what CI runs and what `scripts/ci.sh` runs locally cannot drift apart.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # What changed decides what has to run. Anything unclear (no base commit, a new branch) runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.f.outputs.native }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit: running everything"
            echo "native=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"
          native=false; docker=false
          # Anything that changes a compiled binary or how it is built/tested on a second platform.
          echo "$files" | grep -Eq '^(src/|crates/|tests/|benches/|examples/|assets/|recipes/|Cargo\.(toml|lock)$|rustfmt\.toml$|scripts/ci\.sh$|\.cargo/|\.github/)' && native=true
          # What the container image is made of.
          echo "$files" | grep -Eq '^(Dockerfile$|docker-compose\.yml$|\.dockerignore$|deploy/|src/|crates/|assets/|examples/|Cargo\.(toml|lock)$|\.github/)' && docker=true
          echo "native=$native" >> "$GITHUB_OUTPUT"; echo "docker=$docker" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bash scripts/ci.sh fmt

  test:
    name: full build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux always; the Windows leg only when something it compiles or runs changed.
        os: ${{ fromJSON(needs.changes.outputs.native == 'true' && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The external example crate is its own workspace with its own target/: without listing it here its ~420 dependencies were compiled from scratch on every run
          # (measured on hosted CI: 339 s of an 856 s Linux job, 583 s on Windows). A cache miss costs exactly what it costs today.
          workspaces: |
            . -> target
            examples/external/topdown_switch -> target
      - name: Linux system libraries (audio backend for rodio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # clippy: warnings are errors. tests: real-time UDP suites one test at a time (serial_suites in docs/features.json), everything else on all cores.
      # benches compile. Wall-clock bench regressions are NOT gated here: shared runners are too noisy. Run
      # `cargo bench --bench sim && python benches/check.py` locally (benches/README.md). The deterministic performance guards
      # (tests/alloc_budget.rs, body/entity counts) run in the tests stage.
      # The lock files first: a stale one is the commonest reason a dependency change fails CI, and it takes seconds to see.
      - run: bash scripts/ci.sh lockfiles clippy tests benches
      # Hosted runners may have no GPU adapter at all: the external client's offscreen presentation check is skipped there, not faked.
      - run: bash scripts/ci.sh external-client
        env:
          RED_OFFSCREEN_OPTIONAL: "1"

  # The dedicated server on a bare Linux box: no window, GPU, audio or ffmpeg libraries installed, and none may
  # be compiled or linked either. This is the job that keeps `red_server` deployable on a small VPS.
  headless-linux:
    name: headless server (linux, no gfx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/ci.sh headless-tree headless-build headless-clippy headless-tests

  # The container image people deploy: builds headless, starts, listens on UDP 27015 and exits cleanly.
  docker:
    name: container image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t red-server .
      - name: refuses to start without an identity (fail closed)
        run: |
          if docker run --rm red-server --run-for 3 --stats-secs 0; then echo "started without a server identity"; exit 1; fi
      - name: starts on QUIC with a throwaway identity, listens, stops cleanly
        run: |
          mkdir -m 777 identity
          docker run --rm -v "$PWD/identity:/identity" --entrypoint red_engine2 red-server net-identity --out /identity
          docker run --rm -v "$PWD/identity:/identity:ro" red-server --run-for 3 --stats-secs 0 | tee out.txt
          grep -q '^LISTENING 0.0.0.0:27015' out.txt
          grep -q '^transport: quic' out.txt
          grep -q '^stopped:' out.txt
