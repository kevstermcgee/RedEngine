name: CI
# Full CI belongs at integration boundaries: pull requests and pushes to main. Work-in-progress branch pushes are not built twice (once for the
# push, once for the pull request), a newer push to the same pull request cancels the older run, and jobs that cannot be affected by a change
# are skipped (a docs-only change does not build a Docker image or a Windows binary). The steps themselves are `scripts/ci.sh <stage>`, so
# what CI runs and what `scripts/ci.sh` runs locally cannot drift apart.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # What changed decides what has to run. Anything unclear (no base commit, a new branch) runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.f.outputs.native }}
      docker: ${{ steps.f.outputs.docker }}
      docker_own: ${{ steps.f.outputs.docker_own }}
      pytools: ${{ steps.f.outputs.pytools }}
      games_only: ${{ steps.f.outputs.games_only }}
      docs_only: ${{ steps.f.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit: running everything"
            echo "native=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"; echo "docker_own=true" >> "$GITHUB_OUTPUT"; echo "pytools=true" >> "$GITHUB_OUTPUT"; echo "games_only=false" >> "$GITHUB_OUTPUT"; echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # NUL-separated, because the default output quotes a name with a non-ASCII or special character ("scripts/\303\274.py") and the anchored patterns below would never match the
          # opening quote; a line per file is rebuilt from it. `has` reads the list from a here-string, not a pipe: under `pipefail`, `echo | grep -q` fails when grep exits before echo is done.
          files="$(git diff --name-only -z "$base" HEAD | tr '\0' '\n')"
          echo "$files"
          has() { grep -Eq "$1" <<<"$files"; }
          native=false; docker=false; docker_own=false; pytools=false
          # Anything that changes a compiled binary or how it is built/tested on a second platform.
          has '^(src/|crates/|tests/|benches/|examples/|assets/|recipes/|Cargo\.(toml|lock)$|rustfmt\.toml$|scripts/ci\.sh$|\.cargo/|\.github/)' && native=true
          # What the container image is made of.
          has '^(Dockerfile$|docker-compose\.yml$|\.dockerignore$|deploy/|src/|crates/|assets/|examples/|Cargo\.(toml|lock)$|\.github/)' && docker=true
          # The image's own files: a pull request builds the image only when they change; main builds it for every change it is made of.
          has '^(Dockerfile$|docker-compose\.yml$|\.dockerignore$|deploy/|\.github/)' && docker_own=true
          # The Python tools run on Windows machines too (the launchpad, Idea Forge, the process supervisor, the publisher, the MCP adapter, the bench scripts): paths, quoting, subprocesses and git
          # behave differently there, and a change that is only Python does not touch what `native` looks at. Any Python or PowerShell file, anything under scripts/ (including `dev`, `ci.sh`
          # and the shell helpers the tools call), the publish manifest, tools/ and bench/, and CI itself. Documentation and Rust-only changes do not start it.
          has '^(scripts/|tools/|bench/|benches/.*\.(py|json)$|games-publish\.json$|mcp_server\.py$|\.github/)|\.(py|ps1)$' && pytools=true
          # A pull request that only adds or edits generated games (Idea Forge: examples/2d, examples/3d, its feedback note) cannot change a compiled binary, the container image or a tool: every
          # changed file is game data, and the engine's own tests that read that data are `scripts/ci.sh games`. Linux only, no Windows leg, no headless server build, no image. One file anywhere
          # else (an engine change the game depends on, a fixture, a script) and this is false and the full suite runs. (docs/analysis/2026-10-09-engine-ci-growth.md, proposal 1.)
          games_only=false
          if [ -n "$files" ] && ! grep -Evq '^(examples/2d/|examples/3d/|docs/analysis/idea-forge/)' <<<"$files"; then games_only=true; native=false; docker=false; fi
          # A pull request that changes only documentation (`*.md`, `docs/`) compiles nothing: the `docs` job runs the suites that read the docs from an
          # archive main compiled from the same code (ADR 2026-10-14-ci-compiles-the-tests-once-and-runs-the-server-s-suites).
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$games_only" = false ] && [ -n "$files" ] && ! grep -Evq '(\.md$|^docs/)' <<<"$files"; then
            docs_only=true; native=false; docker=false; docker_own=false
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"; echo "docker=$docker" >> "$GITHUB_OUTPUT"; echo "docker_own=$docker_own" >> "$GITHUB_OUTPUT"; echo "pytools=$pytools" >> "$GITHUB_OUTPUT"; echo "games_only=$games_only" >> "$GITHUB_OUTPUT"; echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bash scripts/ci.sh fmt

  # The fast tier (ADR 2026-10-11-one-validate-for-every-content-file): every content file through its own checker, problems as file:line. It needs only the
  # CLI, built from the test shards' cache, so a broken map, prefab or 2D game is reported minutes before the suite finishes; it does not hold the suite back.
  content:
    name: content validates (every scene, game, prefab library, blueprint)
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.games_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: bash scripts/ci.sh content

  # The suite on Linux, compiled once (`scripts/ci.sh test-archive`: cargo-nextest's archive, and the doctests beside it) and run by five shards that
  # download it instead of each compiling it (ADR 2026-10-14-ci-compiles-the-tests-once-and-runs-the-server-s-suites; the shards
  # were ADR 2026-10-10-ci-shards-the-linux-tests). The serial suites are spread over the shards, one at a time within each.
  build-tests:
    name: tests (linux, compile once)
    needs: changes
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-nextest runs the suite (scripts/ci.sh run_tests; ADR 2026-10-10-ci-runs-the-tests-under-nextest): a prebuilt binary, seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: bash scripts/ci.sh test-archive
        env:
          RED_CI_ARCHIVE: target/nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          # A week on main, where a docs-only pull request finds it (the `docs` job); a day for a pull request's own.
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
          compression-level: 0

  test:
    name: tests (linux, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, build-tests]
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      # Real-time UDP suites one test at a time (serial_suites in docs/features.json), everything else on all cores. The deterministic performance guards
      # (tests/alloc_budget.rs, body/entity counts) run here; wall-clock bench regressions are NOT gated (shared runners are too noisy: benches/README.md).
      - run: bash scripts/ci.sh tests
        env:
          RED_CI_PARTITION: hash:${{ matrix.shard }}/${{ strategy.job-total }}
          RED_CI_ARCHIVE: target/nextest-archive.tar.zst

  # A pull request that changes only documentation: the suites that read the docs (`scripts/ci.sh docs`), against this pull request's docs, from the
  # archive main compiled from the same code: the newest successful run on main whose commit differs from this one only in documentation. Nothing
  # is compiled; when no such archive is left (a week passed, or main's code moved on), the suites are compiled instead.
  docs:
    name: docs (the suites that read them)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - id: archive
        name: main's archive of this code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for row in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 30 --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            run="${row%%:*}"; sha="${row#*:}"
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            # Code that differs from this checkout's (anything but documentation) makes that archive another program.
            if git diff --name-only "$sha" HEAD | grep -Evq '(\.md$|^docs/)'; then continue; fi
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n nextest-archive -D target 2>/dev/null; then
              echo "the archive of $sha (run $run)"; echo "path=target/nextest-archive.tar.zst" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "no archive of this code on main (expired, or main's code moved on): the doc suites are compiled"
      - uses: Swatinem/rust-cache@v2
        if: steps.archive.outputs.path == ''
        with:
          shared-key: linux-tests
          save-if: false
      - run: bash scripts/ci.sh docs
        env:
          RED_CI_ARCHIVE: ${{ steps.archive.outputs.path }}

  # Lints and compile-only checks: nothing here waits for the tests. The lock files first: a stale one is the commonest reason a dependency change fails CI.
  lint:
    name: clippy + benches compile
    needs: changes
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: bash scripts/ci.sh lockfiles clippy benches

  # Games on the engine's public API, in their own job: the external custom client and Killchain.
  api:
    name: games on the public API
    needs: changes
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The external example crate is its own workspace with its own target/: without listing it here its ~420 dependencies were compiled from scratch on every run
          # (measured on hosted CI: 339 s of an 856 s Linux job, 583 s on Windows). A cache miss costs exactly what it costs today.
          workspaces: |
            . -> target
            examples/external/topdown_switch -> target
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # Hosted runners may have no GPU adapter at all: the external client's offscreen presentation check is skipped there, not faked.
      - run: bash scripts/ci.sh external-client
        env:
          RED_OFFSCREEN_OPTIONAL: "1"
      # The games on the public API (games/killchain, games/frameless): same target directory and cache as the engine, so only the games' own crates are compiled here.
      - run: bash scripts/ci.sh game-crates

  # Only generated games changed (see `changes`): the tests that read them, not the whole suite.
  games:
    name: generated games
    needs: changes
    if: needs.changes.outputs.games_only == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: Linux system libraries (audio backend for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: bash scripts/ci.sh games

  # Windows is authoritative for two things Linux cannot answer: Microsoft's shader compiler (Direct3D) and the Python tools' path/quoting/process behaviour (the
  # `python-tools` job). On a pull request this job builds and links every binary and compiles the renderer's pipelines through Direct3D (`scripts/ci.sh direct3d`,
  # a few minutes); the whole suite on Windows, the same stages as Linux, runs on every push to main (ADR 2026-10-10-windows-ci-on-pull-requests-is-build-and-direct3d).
  windows:
    name: windows (${{ github.event_name == 'pull_request' && 'build + Direct3D' || 'full suite' }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            examples/external/topdown_switch -> target
      # cargo-nextest runs the suite (scripts/ci.sh run_tests; ADR 2026-10-10-ci-runs-the-tests-under-nextest): a prebuilt binary, seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: bash scripts/ci.sh direct3d
        if: github.event_name == 'pull_request'
        env:
          RED_DIRECT3D_REQUIRED: "1"
      - run: bash scripts/ci.sh lockfiles clippy tests benches
        if: github.event_name != 'pull_request'
      - run: bash scripts/ci.sh external-client
        if: github.event_name != 'pull_request'
        env:
          RED_OFFSCREEN_OPTIONAL: "1"
      - run: bash scripts/ci.sh game-crates
        if: github.event_name != 'pull_request'

  # The Python tools, on both platforms, without building any Rust: `scripts/ci.sh pytools` runs every scripts/test_*.py and the publish check on this runner's interpreter.
  # The `test` job's Windows leg compiles and runs the engine and only starts for Rust-side changes; a change to launchpad.py, idea_forge.py, proc_supervisor.py or a PowerShell script
  # (path separators, quoting, subprocess and process-tree behaviour, git output) used to reach Windows never, or only by riding on an unrelated Rust change. Minutes, not a build.
  python-tools:
    name: python tools (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.pytools == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci.sh pytools

  # The dedicated server on a bare Linux box: no window, GPU, audio or ffmpeg libraries installed, and none may
  # be compiled or linked either. This is the job that keeps `red_server` deployable on a small VPS. On a pull request it runs the suites that run the
  # server itself (net_*, server_env, sim_replay) headless, in one job; on main the whole suite headless, in three shards
  # (ADR 2026-10-14-ci-compiles-the-tests-once-and-runs-the-server-s-suites).
  headless-linux:
    name: headless server (linux, no gfx, ${{ matrix.shard == 0 && 'the server suites' || format('shard {0}/3', matrix.shard) }})
    needs: changes
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: headless
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      # cargo-nextest runs the suite (scripts/ci.sh run_tests; ADR 2026-10-10-ci-runs-the-tests-under-nextest): a prebuilt binary, seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: bash scripts/ci.sh ${{ matrix.shard == 0 && 'headless-net' || 'headless-tests' }}
        env:
          RED_CI_PARTITION: ${{ matrix.shard != 0 && format('hash:{0}/3', matrix.shard) || '' }}

  # The headless dependency tree, build and clippy (no graphics crates may be compiled or linked): their own job, so neither test shard waits for them.
  headless-build:
    name: headless server (linux, no gfx, build + clippy)
    needs: changes
    if: needs.changes.outputs.games_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/ci.sh headless-tree headless-build headless-clippy

  # The container image people deploy: builds headless, starts, listens on UDP 27015 and exits cleanly.
  # On a pull request only when the image's own files change (Dockerfile, deploy/, CI): the source it is built from is CI's anyway, and main builds it
  # for every change (ADR 2026-10-14-ci-compiles-the-tests-once-and-runs-the-server-s-suites).
  docker:
    name: container image
    needs: changes
    if: needs.changes.outputs.docker == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.docker_own == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t red-server .
      - name: refuses to start without an identity (fail closed)
        run: |
          if docker run --rm red-server --run-for 3 --stats-secs 0; then echo "started without a server identity"; exit 1; fi
      - name: starts on QUIC with a throwaway identity, listens, stops cleanly
        run: |
          mkdir -m 777 identity
          docker run --rm -v "$PWD/identity:/identity" --entrypoint red_engine2 red-server net-identity --out /identity
          docker run --rm -v "$PWD/identity:/identity:ro" red-server --run-for 3 --stats-secs 0 | tee out.txt
          grep -q '^LISTENING 0.0.0.0:27015' out.txt
          grep -q '^transport: quic' out.txt
          grep -q '^stopped:' out.txt
