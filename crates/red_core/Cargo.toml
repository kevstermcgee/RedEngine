[package]
name = "red_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Red Engine's headless core: what the engine crate, the 2D crate and game crates share. No graphics, audio device or network dependencies."

[dependencies]
getrandom = { workspace = true }
glam = { workspace = true }
hmac = { workspace = true }
libm = { workspace = true }
rapier3d = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
# The shader compiler wgpu uses, to validate WGSL and translate it to Direct3D's HLSL on any machine (`shader_check`): the engine's own modules in
# tests/shader_validation.rs, and a game's own sky (`sky.shader`) when its scene is validated. It compiles text and draws nothing; the engine's `render`
# turns it on (a build that can draw the shader checks it), the headless server has none.
naga = { workspace = true, optional = true }

[features]
shader-check = ["dep:naga"]

# The same style policy as the engine crate.
[lints.clippy]
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
