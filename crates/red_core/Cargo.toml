[package]
name = "red_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Red Engine's headless core: what the engine crate, the 2D crate and game crates share. No graphics, audio device or network dependencies."

[dependencies]
getrandom = { workspace = true }
glam = { workspace = true }
hmac = { workspace = true }
libm = { workspace = true }
rapier3d = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

# The same style policy as the engine crate.
[lints.clippy]
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
