<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedEngine games</title>
<style>
  body { margin: 0; background: #0b0d12; color: #cfd6e6; font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem; }
  .bar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: 0 0 1rem; }
  .bar input, .bar select { background: #141a26; color: inherit; border: 1px solid #263049; border-radius: 6px; padding: .45rem .6rem; font: inherit; }
  .bar input { flex: 1; min-width: 10rem; }
  .bar .count { margin-left: auto; opacity: .6; font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; }
  .card { position: relative; background: #141a26; border-radius: 8px; padding: .75rem; }
  .card.fav { box-shadow: 0 0 0 2px #ffd166; }
  .card a.open { color: inherit; text-decoration: none; display: block; }
  .card img { width: 100%; image-rendering: pixelated; border-radius: 4px; }
  .card h2 { margin: .5rem 0 .25rem; font-size: 1.1rem; }
  .card p { margin: 0 0 .5rem; opacity: .85; }
  .card small { opacity: .6; }
  .pres { background: #ffd166; color: #10141d; border-radius: 4px; padding: 0 6px; font-weight: 700; font-size: .75rem; margin-right: .4rem; }
  .heart { position: absolute; top: 1rem; right: 1rem; width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: rgba(10, 12, 18, .75); color: #cfd6e6; font-size: 1.3rem; line-height: 1; cursor: pointer; }
  .heart[aria-pressed="true"] { color: #ffd166; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Filter by name or description" aria-label="Filter games">
    <select id="pres" aria-label="2D or 3D"><option value="">2D and 3D</option><option value="2d">2D</option><option value="3d">3D</option></select>
    <select id="kind" aria-label="Show"><option value="">All games</option><option value="fav">&#x2665; Favourites</option></select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="games">
{{CARDS}}</div>
  <p><small>Hearts are remembered in this browser. Data: <a href="catalog.json">catalog.json</a></small></p>
</main>
<script>
(function () {
  var grid = document.getElementById("games"), q = document.getElementById("q"), pres = document.getElementById("pres"), kind = document.getElementById("kind"), count = document.getElementById("count");
  var cards = Array.prototype.slice.call(grid.querySelectorAll(".card")), KEY = "redengine:hearts";
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  cards.forEach(function (c, i) { c.dataset.i = i; });
  var favs = load();
  function isFav(c) { return favs.indexOf(c.dataset.id) !== -1; }
  function apply() {
    var needle = q.value.trim().toLowerCase();
    cards.sort(function (a, b) { return (isFav(b) ? 1 : 0) - (isFav(a) ? 1 : 0) || a.dataset.i - b.dataset.i; });   // favourites first, each group in catalog order
    var shown = 0;
    cards.forEach(function (c) {
      var f = isFav(c), b = c.querySelector(".heart");
      c.classList.toggle("fav", f); b.setAttribute("aria-pressed", f ? "true" : "false"); b.textContent = f ? "\u2665" : "\u2661";
      var ok = (!needle || c.dataset.text.indexOf(needle) !== -1) && (!pres.value || c.dataset.pres === pres.value || c.dataset.pres === "hybrid") && (kind.value !== "fav" || f);
      c.classList.toggle("hidden", !ok); if (ok) shown++; grid.appendChild(c);
    });
    count.textContent = shown + " of " + cards.length + " games";
  }
  grid.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest(".heart") : null; if (!b) return;
    var id = b.closest(".card").dataset.id, i = favs.indexOf(id);
    if (i === -1) favs.push(id); else favs.splice(i, 1);
    try { localStorage.setItem(KEY, JSON.stringify(favs)); } catch (e) { /* private mode */ }
    apply();
  });
  [q, pres, kind].forEach(function (e) { e.addEventListener("input", apply); });
  apply();
})();
</script>
</body>
</html>
