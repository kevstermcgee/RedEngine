[package]
name = "web3d"
version = "0.1.0"
edition = "2021"
description = "The browser build of the 3D player: a cdylib that re-exports red_engine2::web3d (build with --target wasm32-unknown-unknown)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
red_engine2 = { path = "../..", default-features = false, features = ["web"] }
wasm-bindgen = "=0.2.128"
