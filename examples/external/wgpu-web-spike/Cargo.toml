[package]
name = "spike"
version = "0.0.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "webgpu", "webgl"] }
rapier3d = { version = "0.35", features = ["enhanced-determinism"] }
glam = { version = "0.33.8", features = ["serde", "libm"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Performance"] }
console_error_panic_hook = "0.1"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
